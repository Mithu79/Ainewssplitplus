name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    env:
      # Tests and the build must never depend on outbound network access.
      NEWS_SPLIT_OFFLINE: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (parser, normaliser, clustering, ranking, store, i18n, accounts)
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the API
        run: |
          PORT=3111 npm run start &
          up=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 "http://127.0.0.1:3111/api/status" > /dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then echo "::error::server never answered on :3111"; exit 1; fi
          curl -fsS --max-time 10 "http://127.0.0.1:3111/api/status" | head -c 400; echo
          curl -fsS --max-time 10 "http://127.0.0.1:3111/api/news?category=world&limit=3" | head -c 400; echo
          curl -fsS --max-time 10 "http://127.0.0.1:3111/api/feed?category=tech&limit=3" | head -c 300; echo
          curl -fsS --max-time 30 -o /dev/null -w 'front page: HTTP %{http_code}\n' "http://127.0.0.1:3111/"
          for p in /login /signup /privacy-policy /terms-of-service /security-policy; do
            curl -fsS --max-time 30 -o /dev/null -w "$p: HTTP %{http_code}\n" "http://127.0.0.1:3111$p"
          done
          # /dashboard must redirect signed-out visitors to /login
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "http://127.0.0.1:3111/dashboard")
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 30 "http://127.0.0.1:3111/dashboard")
          echo "/dashboard signed-out: HTTP $code -> $loc"
          case "$code" in 302|307|308) ;; *) echo "::error::/dashboard is not protected (HTTP $code)"; exit 1;; esac
          case "$loc" in *"/login"*) ;; *) echo "::error::/dashboard redirected somewhere other than /login"; exit 1;; esac
          # ns-locale=bn must render the Bengali UI
          if ! curl -fsS --max-time 30 -b ns-locale=bn "http://127.0.0.1:3111/" | grep -q 'lang="bn"'; then
            echo "::error::Bengali locale cookie did not switch <html lang>"; exit 1
          fi
          # native-language feed filter
          curl -fsS --max-time 10 "http://127.0.0.1:3111/api/news?lang=bn&limit=2" | head -c 300; echo
          kill %1
